<rect fill="#fff" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="22" rx="3" stroke="#0ba360" width="35" x="440" y="100"></rect>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="7" text-anchor="middle" x="457" y="115">
                    R7⏰
                </text>
<rect fill="#fff" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="22" rx="3" stroke="#0ba360" width="35" x="480" y="100"></rect>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="7" text-anchor="middle" x="497" y="115">
                    R12⭐
                </text>
<rect fill="#fff" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="22" rx="3" stroke="#0ba360" width="35" x="520" y="100"></rect>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="7" text-anchor="middle" x="537" y="115">
                    R4⏰
                </text>
<path d="M 690 111 C 710 111, 720 111, 740 111" fill="none" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" marker-end="url(#p3-03-ride-hailing-fig10-exArrowFifoGreen)" stroke="#0ba360" stroke-width="2"></path>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="8" text-anchor="end" x="730" y="106">
                    match
                </text>
<!-- Normal FIFO lane -->
<text fill="#0066cc" font-family="'Segoe Print', cursive" font-size="10" font-weight="600" text-anchor="middle" x="585" y="148">
                    Normal FIFO (within cell)
                </text>
<rect fill="#eef6ff" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="32" rx="6" stroke="#0066cc" stroke-width="1.5" width="310" x="430" y="155"></rect>
<rect fill="#fff" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="22" rx="3" stroke="#0066cc" width="30" x="440" y="160"></rect>
<text fill="#0066cc" font-family="'Segoe Print', cursive" font-size="7" text-anchor="middle" x="455" y="175">
                    R8
                </text>
<rect fill="#fff" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="22" rx="3" stroke="#0066cc" width="30" x="475" y="160"></rect>
<text fill="#0066cc" font-family="'Segoe Print', cursive" font-size="7" text-anchor="middle" x="490" y="175">
                    R9
                </text>
<rect fill="#fff" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="22" rx="3" stroke="#0066cc" width="30" x="510" y="160"></rect>
<text fill="#0066cc" font-family="'Segoe Print', cursive" font-size="7" text-anchor="middle" x="525" y="175">
                    R10
                </text>
<rect fill="#fff" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="22" rx="3" stroke="#0066cc" width="30" x="545" y="160"></rect>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="7" text-anchor="middle" x="560" y="175">
                    …
                </text>
<path d="M 690 171 C 710 171, 720 171, 740 171" fill="none" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" marker-end="url(#p3-03-ride-hailing-fig10-exArrowFifo)" stroke="#0066cc" stroke-width="1.5"></path>
<!-- Result box -->
<rect fill="#fff" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="100" rx="8" stroke="#0ba360" stroke-dasharray="4,2" width="300" x="435" y="200"></rect>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="10" font-weight="600" text-anchor="middle" x="585" y="222">
                    Priority scoring per ride
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="585" y="244">
                    wait_time × 0.4 + rider_tier × 0.3 + proximity × 0.3
                </text>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="585" y="264">
                    Rider waiting 8min promoted to priority lane
                </text>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="585" y="284">
                    Avg wait drops: 12min → 3.5min during surge
                </text>
<!-- Bottom: trade-off banner -->
<rect fill="#f0faf5" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="70" rx="10" stroke="#3cba92" width="730" x="25" y="335"></rect>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="11" font-weight="600" text-anchor="middle" x="390" y="358">
                    💬 Interview talking point
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="10" text-anchor="middle" x="390" y="378">
                    Pure FIFO = maximally fair but fragile. Priority = better UX, but opens fairness debates.
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="390" y="395">
                    Compromise: FIFO within a geohash cell, priority across cells — discuss the trade-off with your
                    interviewer.
                </text>
</svg>