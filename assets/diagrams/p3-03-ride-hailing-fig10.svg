<rect fill="#fefefe" height="420" rx="12" width="780"></rect>
<rect fill="url(#p3-03-ride-hailing-fig10-dotGridFifo)" height="420" rx="12" width="780"></rect>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="13" font-weight="600" text-anchor="middle" x="390" y="28">
