<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="7" text-anchor="middle" x="275" y="123">
                    …
                </text>
<rect fill="#f5f5f7" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="28" rx="4" stroke="#ccc" width="55" x="295" y="105"></rect>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="7" text-anchor="middle" x="322" y="123">
                    100k
                </text>
<!-- Block indicator -->
<text fill="#c62828" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="230" y="155">
                    ⬆ ALL BLOCKED behind R3
                </text>
<!-- Result box -->
<rect fill="#fff" filter="url(#p3-03-ride-hailing-fig10-roughenLightFifo)" height="130" rx="8" stroke="#c62828" stroke-dasharray="4,2" width="300" x="45" y="170"></rect>
<text fill="#c62828" font-family="'Segoe Print', cursive" font-size="10" font-weight="600" text-anchor="middle" x="195" y="195">
