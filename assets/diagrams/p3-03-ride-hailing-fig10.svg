                </text>
<text fill="#c62828" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="195" y="260">
                    Avg wait: 4min → 12min+ during surge
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="195" y="280">
                    Rider who waited 8min still behind fresh request
                </text>
<!-- RIGHT: Priority Queue (Great) -->
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="13" font-weight="700" text-anchor="middle" x="585" y="55">
