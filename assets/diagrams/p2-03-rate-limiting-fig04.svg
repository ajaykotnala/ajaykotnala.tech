<svg style="max-width: 780px" viewbox="0 0 780 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p2-03-rate-limiting-fig04-dotGridR4" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p2-03-rate-limiting-fig04-roughenR4" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="24" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<marker id="p2-03-rate-limiting-fig04-exArrowR4" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<rect fill="#fefefe" height="340" rx="12" width="780"></rect>
<rect fill="url(#p2-03-rate-limiting-fig04-dotGridR4)" height="340" rx="12" width="780"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" text-anchor="middle" x="390" y="28">
                    You must decide before you know the cost — so reserve high and settle after
                </text>
<!-- step 1 -->
<rect fill="#f5f3ff" filter="url(#p2-03-rate-limiting-fig04-roughenR4)" height="110" rx="9" stroke="#6d28d9" stroke-width="1.5" width="200" x="35" y="60"></rect>
<text fill="#6d28d9" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="135" y="84">1 · RESERVE</text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="135" y="106">input 12,000 tokens known</text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="135" y="124">max_output 4,000 assumed</text>
<text fill="#6d28d9" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" font-weight="700" text-anchor="middle" x="135" y="146">debit 16,000</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="135" y="162">worst case, never the average</text>
<!-- step 2 -->
<rect fill="#eef6ff" filter="url(#p2-03-rate-limiting-fig04-roughenR4)" height="110" rx="9" stroke="#0066cc" stroke-width="1.5" width="200" x="290" y="60"></rect>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="390" y="84">2 · SERVE</text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="390" y="106">model streams the response</text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="390" y="126">actual output: 900 tokens</text>
<text fill="#be123c" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="390" y="150">on error → refund the full 16,000</text>
<!-- step 3 -->
<rect fill="#dcfce7" filter="url(#p2-03-rate-limiting-fig04-roughenR4)" height="110" rx="9" stroke="#16a34a" stroke-width="1.5" width="200" x="545" y="60"></rect>
<text fill="#15803d" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="645" y="84">3 · RECONCILE</text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="645" y="106">actual cost: 12,900</text>
<text fill="#15803d" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" font-weight="700" text-anchor="middle" x="645" y="128">refund 3,100</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="645" y="150">overspend? debit it, allow negative</text>
<path d="M 235 115 L 286 115" fill="none" marker-end="url(#p2-03-rate-limiting-fig04-exArrowR4)" stroke="#333" stroke-width="1.5"></path>
<path d="M 490 115 L 541 115" fill="none" marker-end="url(#p2-03-rate-limiting-fig04-exArrowR4)" stroke="#333" stroke-width="1.5"></path>
<!-- bucket level bar -->
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="390" y="212">Bucket balance through the request</text>
<rect fill="#f5f5f7" height="26" rx="5" stroke="#c9c9c9" stroke-width="1.2" width="600" x="90" y="228"></rect>
<rect fill="#dcfce7" height="26" rx="5" stroke="#16a34a" stroke-width="1.2" width="230" x="90" y="228"></rect>
<text fill="#15803d" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="205" y="246">available 40,000</text>
<rect fill="#f5f3ff" height="26" rx="0" stroke="#6d28d9" stroke-width="1.2" width="240" x="320" y="228"></rect>
<text fill="#6d28d9" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="440" y="246">reserved 16,000 (held)</text>
<rect fill="#dcfce7" height="26" rx="5" stroke="#16a34a" stroke-width="1.2" width="130" x="560" y="228"></rect>
<text fill="#15803d" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="625" y="246">3,100 returned</text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="390" y="290">
                    Under-reserving is unrecoverable; over-reserving is just briefly conservative.
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="390" y="312">
                    Reserve pessimistically. Refund generously. Never forgive an overspend.
                </text>
</svg>