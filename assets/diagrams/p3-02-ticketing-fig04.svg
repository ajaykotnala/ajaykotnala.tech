<svg style="max-width: 780px" viewbox="0 0 780 520" xmlns="http://www.w3.org/2000/svg"><defs><marker id="p3-02-ticketing-fig04-exArrow" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker><filter height="102%" id="p3-02-ticketing-fig04-roughenLight" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="5" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter><filter height="104%" id="p3-02-ticketing-fig04-roughen" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="2" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter><pattern height="20" id="p3-02-ticketing-fig04-dotGrid" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern></defs>
<rect fill="#fefefe" height="520" rx="12" width="780"></rect>
<rect fill="url(#p3-02-ticketing-fig04-dotGrid)" height="520" rx="12" width="780"></rect>
<!-- Step labels on left -->
<text fill="#C4242D" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" x="20" y="75">
                    ① Select Seat
                </text>
<text fill="#C4242D" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" x="20" y="168">
                    ② Lock in Redis
                </text>
<text fill="#C4242D" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" x="20" y="245">
                    ③ Create Booking
                </text>
<text fill="#C4242D" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" x="20" y="325">
                    ④ Payment
                </text>
<text fill="#C4242D" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" x="20" y="430">
                    ⑤ Confirm
                </text>
<!-- Client Column -->
<rect fill="#eef6ff" filter="url(#p3-02-ticketing-fig04-roughen)" height="50" rx="10" stroke="#333" stroke-width="2" width="100" x="120" y="30"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="13" font-weight="600" text-anchor="middle" x="170" y="60">
                    Client
                </text>
<!-- Booking Service Column -->
<rect fill="#fce4ec" filter="url(#p3-02-ticketing-fig04-roughen)" height="50" rx="10" stroke="#C4242D" stroke-width="2" width="120" x="290" y="30"></rect>
<text fill="#C4242D" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" font-weight="600" text-anchor="middle" x="350" y="60">
                    Booking Svc
                </text>
<!-- Redis Column -->
<rect fill="#fff3e0" filter="url(#p3-02-ticketing-fig04-roughen)" height="50" rx="10" stroke="#e56b47" stroke-width="2" width="100" x="480" y="30"></rect>
<text fill="#e56b47" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="13" font-weight="600" text-anchor="middle" x="530" y="60">
                    Redis
                </text>
<!-- Stripe Column -->
<rect fill="#e8f5e9" filter="url(#p3-02-ticketing-fig04-roughen)" height="50" rx="10" stroke="#2e7d32" stroke-width="2" width="100" x="650" y="30"></rect>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="13" font-weight="600" text-anchor="middle" x="700" y="60">
                    Stripe
                </text>
<!-- Vertical lifelines -->
<line stroke="#e0e0e0" stroke-dasharray="4,4" stroke-width="1" x1="170" x2="170" y1="80" y2="500"></line>
<line stroke="#e0e0e0" stroke-dasharray="4,4" stroke-width="1" x1="350" x2="350" y1="80" y2="500"></line>
<line stroke="#e0e0e0" stroke-dasharray="4,4" stroke-width="1" x1="530" x2="530" y1="80" y2="500"></line>
<line stroke="#e0e0e0" stroke-dasharray="4,4" stroke-width="1" x1="700" x2="700" y1="80" y2="500"></line>
<!-- Step 1: Client → Booking (POST /bookings) -->
<path d="M 170 100 L 340 100" fill="none" filter="url(#p3-02-ticketing-fig04-roughenLight)" marker-end="url(#p3-02-ticketing-fig04-exArrow)" stroke="#333" stroke-width="2"></path>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="255" y="93">
                    POST /bookings
                </text>
<!-- Step 2: Booking → Redis (SET NX EX) -->
<path d="M 350 145 L 520 145" fill="none" filter="url(#p3-02-ticketing-fig04-roughenLight)" marker-end="url(#p3-02-ticketing-fig04-exArrow)" stroke="#e56b47" stroke-width="2"></path>
<text fill="#e56b47" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="435" y="138">
                    SET ticket:id NX EX 600
                </text>
<!-- Redis response -->
<path d="M 520 170 L 360 170" fill="none" filter="url(#p3-02-ticketing-fig04-roughenLight)" marker-end="url(#p3-02-ticketing-fig04-exArrow)" stroke="#e56b47" stroke-dasharray="5,3" stroke-width="1.5"></path>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="440" y="185">
                    OK (locked for 10 min)
                </text>
<!-- Step 3: Booking writes to DB -->
<rect fill="#f5f5f7" filter="url(#p3-02-ticketing-fig04-roughen)" height="35" rx="8" stroke="#ccc" stroke-width="1" width="160" x="310" y="215"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="390" y="237">
                    Write booking: in-progress
                </text>
<!-- Step 4: Return bookingId to client -->
<path d="M 350 270 L 180 270" fill="none" filter="url(#p3-02-ticketing-fig04-roughenLight)" marker-end="url(#p3-02-ticketing-fig04-exArrow)" stroke="#333" stroke-dasharray="5,3" stroke-width="1.5"></path>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="265" y="263">
                    bookingId + redirect
                </text>
<!-- Step 5: Client → Stripe (payment) -->
<path d="M 170 310 L 690 310" fill="none" filter="url(#p3-02-ticketing-fig04-roughenLight)" marker-end="url(#p3-02-ticketing-fig04-exArrow)" stroke="#2e7d32" stroke-width="2"></path>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="430" y="303">
                    Stripe.js tokenize → PaymentIntent
                </text>
<!-- Timer box -->
<rect fill="#fdf5f6" filter="url(#p3-02-ticketing-fig04-roughen)" height="30" rx="6" stroke="#C4242D" stroke-width="1.5" width="100" x="120" y="340"></rect>
<text fill="#C4242D" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="170" y="360">
                    ⏱ 9:47 left
                </text>
<!-- Step 6: Stripe webhook → Booking -->
<path d="M 700 380 L 360 380" fill="none" filter="url(#p3-02-ticketing-fig04-roughenLight)" marker-end="url(#p3-02-ticketing-fig04-exArrow)" stroke="#2e7d32" stroke-dasharray="6,4" stroke-width="2"></path>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="530" y="373">
                    Webhook: payment_success
                </text>
<!-- Step 7: Confirm -->
<rect fill="#e8f5e9" filter="url(#p3-02-ticketing-fig04-roughen)" height="50" rx="10" stroke="#2e7d32" stroke-width="2" width="180" x="290" y="410"></rect>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="600" text-anchor="middle" x="380" y="433">
                    ✓ Ticket → sold
                </text>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="600" text-anchor="middle" x="380" y="450">
                    ✓ Booking → confirmed
                </text>
<!-- TTL expiry note -->
<rect fill="#fff3e0" filter="url(#p3-02-ticketing-fig04-roughen)" height="40" rx="8" stroke="#e56b47" stroke-dasharray="5,3" stroke-width="1.5" width="150" x="480" y="420"></rect>
<text fill="#e56b47" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="555" y="438">
                    If TTL expires →
                </text>
<text fill="#e56b47" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="555" y="452">
                    auto-release lock
                </text>
</svg>