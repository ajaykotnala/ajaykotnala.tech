<svg style="max-width: 780px" viewbox="0 0 780 400" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="20" id="p3-02-ticketing-fig06-dotGrid" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern><marker id="p3-02-ticketing-fig06-exArrowRed" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#C4242D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker><marker id="p3-02-ticketing-fig06-exArrow" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker><filter height="102%" id="p3-02-ticketing-fig06-roughenLight" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="5" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter><filter height="104%" id="p3-02-ticketing-fig06-roughen" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="2" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter></defs>
<rect fill="#fefefe" height="400" rx="12" width="780"></rect>
<rect fill="url(#p3-02-ticketing-fig06-dotGrid)" height="400" rx="12" width="780"></rect>
<!-- Queue of users -->
<rect fill="#eef6ff" filter="url(#p3-02-ticketing-fig06-roughen)" height="180" rx="12" stroke="#333" stroke-width="2" width="120" x="30" y="120"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" font-weight="600" text-anchor="middle" x="90" y="155">
                    Waiting Users
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="22" text-anchor="middle" x="90" y="185">
                    👤👤👤
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="22" text-anchor="middle" x="90" y="215">
                    👤👤👤
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="22" text-anchor="middle" x="90" y="245">
                    👤👤👤
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" text-anchor="middle" x="90" y="275">
                    10M+ in queue
                </text>
<!-- Arrow to Queue Service -->
<path d="M 150 210 C 170 208, 190 212, 215 210" fill="none" filter="url(#p3-02-ticketing-fig06-roughenLight)" marker-end="url(#p3-02-ticketing-fig06-exArrow)" stroke="#333" stroke-linecap="round" stroke-width="2"></path>
<!-- Queue Service -->
<rect fill="#fff3e0" filter="url(#p3-02-ticketing-fig06-roughen)" height="150" rx="10" stroke="#e56b47" stroke-width="2" width="140" x="222" y="135"></rect>
<text fill="#e56b47" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="292" y="175">
                    Queue
                </text>
<text fill="#e56b47" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="292" y="195">
                    Service
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="292" y="222">
                    Redis Sorted Set
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="292" y="238">
                    SSE position updates
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="292" y="268">
                    ⏱ "You are #4,521"
                </text>
<!-- Arrow: dequeue -->
<path d="M 362 210 C 382 208, 402 212, 425 210" fill="none" filter="url(#p3-02-ticketing-fig06-roughenLight)" marker-end="url(#p3-02-ticketing-fig06-exArrow)" stroke="#2e7d32" stroke-linecap="round" stroke-width="2"></path>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="393" y="198">
                    Admit
                </text>
<!-- Admitted Users → Booking -->
<rect fill="#fce4ec" filter="url(#p3-02-ticketing-fig06-roughen)" height="150" rx="10" stroke="#C4242D" stroke-width="2" width="140" x="432" y="135"></rect>
<text fill="#C4242D" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="502" y="175">
                    Booking
                </text>
<text fill="#C4242D" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="502" y="195">
                    Service
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="502" y="222">
                    Seat map shown
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="502" y="238">
                    SSE seat updates
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="502" y="260">
                    Reserve → Pay → Confirm
                </text>
<!-- Redis: Admitted Set -->
<rect fill="#fff3e0" filter="url(#p3-02-ticketing-fig06-roughen)" height="55" rx="10" stroke="#e56b47" stroke-dasharray="5,3" stroke-width="1.5" width="140" x="432" y="310"></rect>
<text fill="#e56b47" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="600" text-anchor="middle" x="502" y="335">
                    Redis: admitted set
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="502" y="352">
                    Session ID + TTL
                </text>
<!-- Arrow: Booking ↔ Admitted -->
<path d="M 502 285 C 502 292, 502 300, 502 308" fill="none" filter="url(#p3-02-ticketing-fig06-roughenLight)" marker-end="url(#p3-02-ticketing-fig06-exArrow)" stroke="#e56b47" stroke-dasharray="4,3" stroke-width="1.5"></path>
<!-- Arrow to DB/Stripe -->
<path d="M 572 210 C 600 208, 620 212, 645 210" fill="none" filter="url(#p3-02-ticketing-fig06-roughenLight)" marker-end="url(#p3-02-ticketing-fig06-exArrowRed)" stroke="#C4242D" stroke-linecap="round" stroke-width="2"></path>
<!-- DB + Stripe -->
<rect fill="#e8f5e9" filter="url(#p3-02-ticketing-fig06-roughen)" height="110" rx="10" stroke="#2e7d32" stroke-width="2" width="100" x="652" y="155"></rect>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" font-weight="600" text-anchor="middle" x="702" y="195">
                    PostgreSQL
                </text>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" font-weight="600" text-anchor="middle" x="702" y="215">
                    + Stripe
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="702" y="240">
                    Final confirmation
                </text>
<!-- Admin toggle -->
<rect fill="#f5f5f7" filter="url(#p3-02-ticketing-fig06-roughen)" height="40" rx="8" stroke="#ccc" stroke-width="1.5" width="140" x="222" y="50"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="292" y="72">
                    🔧 Admin-enabled per event
                </text>
<path d="M 292 90 L 292 133" fill="none" filter="url(#p3-02-ticketing-fig06-roughenLight)" stroke="#ccc" stroke-dasharray="4,3" stroke-width="1"></path>
</svg>