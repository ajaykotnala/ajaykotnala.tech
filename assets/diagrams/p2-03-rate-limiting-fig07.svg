<svg style="max-width: 780px" viewbox="0 0 780 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p2-03-rate-limiting-fig07-dotGridR7" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p2-03-rate-limiting-fig07-roughenR7" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="27" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
</defs>
<rect fill="#fefefe" height="300" rx="12" width="780"></rect>
<rect fill="url(#p2-03-rate-limiting-fig07-dotGridR7)" height="300" rx="12" width="780"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" text-anchor="middle" x="390" y="26">
                    10,000 clients get a 429 at t=0. What arrives next?
                </text>
<!-- without jitter -->
<text fill="#be123c" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="195" y="54">FIXED DELAY — all wait 1s</text>
<path d="M 45 180 L 345 180" fill="none" stroke="#999" stroke-width="1.3"></path>
<path d="M 45 180 L 45 80" fill="none" stroke="#999" stroke-width="1.3"></path>
<rect fill="#fecdd3" filter="url(#p2-03-rate-limiting-fig07-roughenR7)" height="92" stroke="#be123c" stroke-width="1.4" width="18" x="182" y="88"></rect>
<text fill="#be123c" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" font-weight="700" text-anchor="middle" x="191" y="80">10,000</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="195" y="198">t = 1.0s</text>
<text fill="#be123c" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="195" y="222">A spike sharper than the original —</text>
<text fill="#be123c" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="195" y="238">rejected again, and re-synchronised.</text>
<path d="M 390 55 L 390 260" fill="none" stroke="#ddd" stroke-dasharray="4,4" stroke-width="1"></path>
<!-- with jitter -->
<text fill="#15803d" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="585" y="54">FULL JITTER — random(0, ceiling)</text>
<path d="M 435 180 L 735 180" fill="none" stroke="#999" stroke-width="1.3"></path>
<path d="M 435 180 L 435 80" fill="none" stroke="#999" stroke-width="1.3"></path>
<rect fill="#dcfce7" height="28" stroke="#16a34a" stroke-width="1.2" width="18" x="452" y="152"></rect>
<rect fill="#dcfce7" height="35" stroke="#16a34a" stroke-width="1.2" width="18" x="478" y="145"></rect>
<rect fill="#dcfce7" height="31" stroke="#16a34a" stroke-width="1.2" width="18" x="504" y="149"></rect>
<rect fill="#dcfce7" height="37" stroke="#16a34a" stroke-width="1.2" width="18" x="530" y="143"></rect>
<rect fill="#dcfce7" height="30" stroke="#16a34a" stroke-width="1.2" width="18" x="556" y="150"></rect>
<rect fill="#dcfce7" height="34" stroke="#16a34a" stroke-width="1.2" width="18" x="582" y="146"></rect>
<rect fill="#dcfce7" height="28" stroke="#16a34a" stroke-width="1.2" width="18" x="608" y="152"></rect>
<rect fill="#dcfce7" height="33" stroke="#16a34a" stroke-width="1.2" width="18" x="634" y="147"></rect>
<rect fill="#dcfce7" height="29" stroke="#16a34a" stroke-width="1.2" width="18" x="660" y="151"></rect>
<rect fill="#dcfce7" height="32" stroke="#16a34a" stroke-width="1.2" width="18" x="686" y="148"></rect>
<text fill="#15803d" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" font-weight="700" text-anchor="middle" x="585" y="130">~1,000 per 100ms slice</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="585" y="198">t = 0 → 1.0s, spread flat</text>
<text fill="#15803d" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="585" y="222">Peak load cut by an order of magnitude,</text>
<text fill="#15803d" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="585" y="238">and each wave de-synchronises further.</text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="390" y="278">
                    Same number of retries either way. Jitter changes only when they land — which is everything.
                </text>
</svg>