<rect fill="#fff3e0" filter="url(#p2-04-event-streaming-fig06-roughen5)" height="170" opacity="0.9" rx="8" stroke="#00a896" stroke-dasharray="5,3" stroke-width="1.5" width="100" x="290" y="60"></rect>
