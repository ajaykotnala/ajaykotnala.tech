                </text>
<rect fill="#e0f2f1" filter="url(#p2-04-event-streaming-fig06-roughen5)" height="22" rx="5" stroke="#00796b" stroke-width="2" width="60" x="220" y="125"></rect>
<text fill="#00796b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="250" y="140">
