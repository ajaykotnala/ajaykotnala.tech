                </text>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" font-weight="700" x="30" y="140">
                    C2
                </text>
<text fill="#00a896" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" font-weight="700" x="30" y="190">
