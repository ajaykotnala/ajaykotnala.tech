                </text>
<rect fill="#f0faf8" filter="url(#p2-04-event-streaming-fig06-roughen5)" height="22" rx="5" stroke="#00a896" stroke-width="1.5" width="140" x="410" y="175"></rect>
<text fill="#00a896" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="480" y="190">
