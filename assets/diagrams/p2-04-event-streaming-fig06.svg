                </text>
<!-- C2 dies -->
<rect fill="#eef6ff" filter="url(#p2-04-event-streaming-fig06-roughen5)" height="22" rx="5" stroke="#0066cc" stroke-width="1.5" width="120" x="100" y="125"></rect>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="160" y="140">
