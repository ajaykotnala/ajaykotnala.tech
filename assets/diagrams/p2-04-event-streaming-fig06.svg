<!-- Offset commit note -->
<rect fill="#fefaf6" filter="url(#p2-04-event-streaming-fig06-roughen5)" height="80" rx="8" stroke="#e0e0e0" stroke-width="1.5" width="170" x="570" y="110"></rect>
<text fill="#00796b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" font-weight="600" text-anchor="middle" x="655" y="135">
