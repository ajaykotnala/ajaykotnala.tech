<svg style="max-width: 760px" viewbox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p2-04-event-streaming-fig06-dotGrid5" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p2-04-event-streaming-fig06-roughen5" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="10" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<filter height="102%" id="p2-04-event-streaming-fig06-roughenLight5" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="11" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<marker id="p2-04-event-streaming-fig06-exArrow5" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<rect fill="#fefefe" height="300" rx="12" width="760"></rect>
<rect fill="url(#p2-04-event-streaming-fig06-dotGrid5)" height="300" rx="12" width="760"></rect>
<path d="M 80 40 L 700 40" fill="none" filter="url(#p2-04-event-streaming-fig06-roughenLight5)" marker-end="url(#p2-04-event-streaming-fig06-exArrow5)" stroke="#ccc" stroke-width="1.5"></path>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" text-anchor="middle" x="390" y="28">
