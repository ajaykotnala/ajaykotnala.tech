<rect fill="#e0f2f1" filter="url(#p2-04-event-streaming-fig06-roughen5)" height="22" rx="5" stroke="#00796b" stroke-width="1.5" width="140" x="410" y="75"></rect>
<text fill="#00796b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="480" y="90">
