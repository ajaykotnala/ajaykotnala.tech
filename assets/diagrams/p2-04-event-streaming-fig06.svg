                </text>
<line stroke="#e0e0e0" stroke-width="1" x1="60" x2="60" y1="50" y2="250"></line>
<!-- C1 processing P0 -->
<rect fill="#e0f2f1" filter="url(#p2-04-event-streaming-fig06-roughen5)" height="22" rx="5" stroke="#00796b" stroke-width="1.5" width="180" x="100" y="75"></rect>
<text fill="#00796b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="190" y="90">
