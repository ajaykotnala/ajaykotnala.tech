<svg style="max-width: 760px" viewbox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p2-04-event-streaming-fig03-dotGrid3" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p2-04-event-streaming-fig03-roughen3" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="4" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<filter height="102%" id="p2-04-event-streaming-fig03-roughenLight3" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="8" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<marker id="p2-04-event-streaming-fig03-exArrow3" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="p2-04-event-streaming-fig03-exArrowTeal3" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#00796b" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<rect fill="#fefefe" height="340" rx="12" width="760"></rect>
<rect fill="url(#p2-04-event-streaming-fig03-dotGrid3)" height="340" rx="12" width="760"></rect>
<!-- Steps -->
<rect fill="#e0f2f1" filter="url(#p2-04-event-streaming-fig03-roughen3)" height="80" rx="10" stroke="#00796b" stroke-width="2" width="95" x="30" y="130"></rect>
<text fill="#00796b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="600" text-anchor="middle" x="77" y="165">
                    Producer
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="77" y="185">
                    batch + compress
                </text>
<path d="M 125 170 L 155 170" fill="none" filter="url(#p2-04-event-streaming-fig03-roughenLight3)" marker-end="url(#p2-04-event-streaming-fig03-exArrowTeal3)" stroke="#00796b" stroke-width="2"></path>
<rect fill="#fff3e0" filter="url(#p2-04-event-streaming-fig03-roughen3)" height="80" rx="10" stroke="#00a896" stroke-width="1.5" width="110" x="160" y="130"></rect>
<text fill="#00a896" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" font-weight="600" text-anchor="middle" x="215" y="160">
                    Partitioner
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="215" y="180">
                    hash(key) → P1
                </text>
<path d="M 270 170 L 300 170" fill="none" filter="url(#p2-04-event-streaming-fig03-roughenLight3)" marker-end="url(#p2-04-event-streaming-fig03-exArrow3)" stroke="#333" stroke-width="2"></path>
<rect fill="#e8f5e9" filter="url(#p2-04-event-streaming-fig03-roughen3)" height="110" rx="10" stroke="#2e7d32" stroke-width="2" width="120" x="305" y="115"></rect>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="600" text-anchor="middle" x="365" y="145">
                    Leader (B2)
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="365" y="165">
                    append to log
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="365" y="185">
                    offset = 1042
                </text>
<!-- Replication arrows -->
<path d="M 365 225 C 365 250, 280 260, 230 270" fill="none" filter="url(#p2-04-event-streaming-fig03-roughenLight3)" marker-end="url(#p2-04-event-streaming-fig03-exArrow3)" stroke="#86868b" stroke-dasharray="5,3" stroke-width="1.5"></path>
<path d="M 365 225 C 365 250, 450 260, 500 270" fill="none" filter="url(#p2-04-event-streaming-fig03-roughenLight3)" marker-end="url(#p2-04-event-streaming-fig03-exArrow3)" stroke="#86868b" stroke-dasharray="5,3" stroke-width="1.5"></path>
<rect fill="#f5f5f7" filter="url(#p2-04-event-streaming-fig03-roughen3)" height="55" rx="8" stroke="#ccc" stroke-width="1.5" width="100" x="155" y="255"></rect>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="205" y="280">
                    Follower B1
                </text>
<rect fill="#f5f5f7" filter="url(#p2-04-event-streaming-fig03-roughen3)" height="55" rx="8" stroke="#ccc" stroke-width="1.5" width="100" x="475" y="255"></rect>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="525" y="280">
                    Follower B3
                </text>
<path d="M 425 170 L 455 170" fill="none" filter="url(#p2-04-event-streaming-fig03-roughenLight3)" marker-end="url(#p2-04-event-streaming-fig03-exArrowTeal3)" stroke="#00796b" stroke-width="2"></path>
<rect fill="#e0f2f1" filter="url(#p2-04-event-streaming-fig03-roughen3)" height="80" rx="10" stroke="#00796b" stroke-width="2" width="120" x="460" y="130"></rect>
<text fill="#00796b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" font-weight="600" text-anchor="middle" x="520" y="158">
                    Ack to Producer
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="520" y="178">
                    acks=all → ISR
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="520" y="196">
