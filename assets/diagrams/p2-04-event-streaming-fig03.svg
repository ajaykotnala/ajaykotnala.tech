                </text>
<!-- acks legend -->
<rect fill="#fefaf6" filter="url(#p2-04-event-streaming-fig03-roughen3)" height="200" rx="10" stroke="#e0e0e0" stroke-dasharray="6,4" stroke-width="1.5" width="140" x="600" y="50"></rect>
<text fill="#00796b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="600" text-anchor="middle" x="670" y="75">
                    acks setting
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" x="615" y="100">
                    0 = fire &amp; forget
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" x="615" y="125">
                    1 = leader ack
                </text>
<text fill="#00796b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" font-weight="600" x="615" y="150">
                    all = ISR ack ✓
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" x="615" y="180">
                    Production default
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" x="615" y="200">
                    for durability
                </text>
</svg>