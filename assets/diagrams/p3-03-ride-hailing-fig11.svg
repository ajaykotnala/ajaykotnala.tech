<svg style="max-width: 780px" viewbox="0 0 780 440" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p3-03-ride-hailing-fig11-dotGridTemporal" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p3-03-ride-hailing-fig11-roughenTemporal" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="15" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<filter height="102%" id="p3-03-ride-hailing-fig11-roughenLightTemporal" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="17" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<marker id="p3-03-ride-hailing-fig11-exArrowTemporal" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#0ba360" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="p3-03-ride-hailing-fig11-exArrowTemporalRed" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#c62828" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="p3-03-ride-hailing-fig11-exArrowTemporalBlue" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#0066cc" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="p3-03-ride-hailing-fig11-exArrowTemporalGray" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#86868b" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<rect fill="#fefefe" height="440" rx="12" width="780"></rect>
<rect fill="url(#p3-03-ride-hailing-fig11-dotGridTemporal)" height="440" rx="12" width="780"></rect>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="13" font-weight="600" text-anchor="middle" x="390" y="28">
                    TEMPORAL DURABLE WORKFLOW — DRIVER OFFER CASCADE
                </text>
<!-- Workflow start -->
<circle cx="40" cy="120" fill="#0ba360" filter="url(#p3-03-ride-hailing-fig11-roughenTemporal)" r="16" stroke="#333" stroke-width="1.5"></circle>
<text fill="#fff" font-family="'Segoe Print', cursive" font-size="10" text-anchor="middle" x="40" y="125">
                    ▶
                </text>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="9" font-weight="600" text-anchor="middle" x="40" y="90">
                    start
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="8" text-anchor="middle" x="40" y="150">
                    ride_id
                </text>
<!-- Activity 1: offerDriver(D1) -->
<path d="M 56 120 C 70 120, 78 120, 90 120" fill="none" filter="url(#p3-03-ride-hailing-fig11-roughenLightTemporal)" marker-end="url(#p3-03-ride-hailing-fig11-exArrowTemporal)" stroke="#0ba360" stroke-width="2"></path>
<rect fill="#e8f5e9" filter="url(#p3-03-ride-hailing-fig11-roughenTemporal)" height="48" rx="10" stroke="#0ba360" stroke-width="2" width="130" x="100" y="96"></rect>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="11" font-weight="600" text-anchor="middle" x="165" y="116">
                    offerDriver(D1)
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="165" y="134">
                    push notification
                </text>
<!-- Activity 2: waitSignal(10s) -->
<path d="M 230 120 C 250 120, 260 120, 275 120" fill="none" filter="url(#p3-03-ride-hailing-fig11-roughenLightTemporal)" marker-end="url(#p3-03-ride-hailing-fig11-exArrowTemporal)" stroke="#0ba360" stroke-width="2"></path>
<rect fill="#fff3e0" filter="url(#p3-03-ride-hailing-fig11-roughenTemporal)" height="48" rx="10" stroke="#3cba92" stroke-width="2" width="130" x="285" y="96"></rect>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="11" font-weight="600" text-anchor="middle" x="350" y="116">
                    waitSignal(10s)
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="350" y="134">
                    ⏱ timer OR accept
                </text>
<!-- Branch: timeout path (down) -->
<path d="M 350 144 C 350 170, 350 185, 350 195" fill="none" filter="url(#p3-03-ride-hailing-fig11-roughenLightTemporal)" marker-end="url(#p3-03-ride-hailing-fig11-exArrowTemporalRed)" stroke="#c62828" stroke-width="2"></path>
<text fill="#c62828" font-family="'Segoe Print', cursive" font-size="9" font-weight="600" x="370" y="175">
                    timeout
                </text>
<!-- Activity 3: offerDriver(D2) on timeout -->
<rect fill="#ffebee" filter="url(#p3-03-ride-hailing-fig11-roughenTemporal)" height="48" rx="10" stroke="#c62828" stroke-width="2" width="130" x="285" y="205"></rect>
<text fill="#c62828" font-family="'Segoe Print', cursive" font-size="11" font-weight="600" text-anchor="middle" x="350" y="225">
                    offerDriver(D2)
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="350" y="243">
                    next candidate
                </text>
<!-- Loop back to waitSignal -->
<path d="M 285 229 C 255 229, 240 180, 285 120" fill="none" filter="url(#p3-03-ride-hailing-fig11-roughenLightTemporal)" marker-end="url(#p3-03-ride-hailing-fig11-exArrowTemporalGray)" stroke="#86868b" stroke-dasharray="4,3" stroke-width="1.5"></path>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="8" text-anchor="middle" x="245" y="175">
                    wait again
                </text>
<!-- Branch: accept path (right) -->
<path d="M 415 120 C 440 120, 460 120, 480 120" fill="none" filter="url(#p3-03-ride-hailing-fig11-roughenLightTemporal)" marker-end="url(#p3-03-ride-hailing-fig11-exArrowTemporal)" stroke="#0ba360" stroke-width="2.5"></path>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="9" font-weight="600" x="450" y="112">
                    accept ✓
                </text>
<!-- Activity 4: complete -->
<rect fill="#c8e6c9" filter="url(#p3-03-ride-hailing-fig11-roughenTemporal)" height="48" rx="10" stroke="#0ba360" stroke-width="2" width="120" x="490" y="96"></rect>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="11" font-weight="600" text-anchor="middle" x="550" y="116">
                    complete()
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="550" y="134">
                    ride → assigned
                </text>
<!-- End circle -->
<path d="M 610 120 C 630 120, 640 120, 650 120" fill="none" filter="url(#p3-03-ride-hailing-fig11-roughenLightTemporal)" marker-end="url(#p3-03-ride-hailing-fig11-exArrowTemporal)" stroke="#0ba360" stroke-width="2"></path>
<circle cx="670" cy="120" fill="none" r="14" stroke="#333" stroke-width="2"></circle>
<circle cx="670" cy="120" fill="#333" r="10"></circle>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="9" font-weight="600" text-anchor="middle" x="670" y="150">
                    end
                </text>
<!-- Exhaust path from D2 -->
<path d="M 350 253 C 350 280, 350 290, 350 300" fill="none" filter="url(#p3-03-ride-hailing-fig11-roughenLightTemporal)" marker-end="url(#p3-03-ride-hailing-fig11-exArrowTemporalRed)" stroke="#c62828" stroke-dasharray="4,3" stroke-width="1.5"></path>
<rect fill="#f5f5f7" filter="url(#p3-03-ride-hailing-fig11-roughenTemporal)" height="40" rx="8" stroke="#86868b" width="130" x="285" y="305"></rect>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="10" font-weight="600" text-anchor="middle" x="350" y="322">
                    exhaust list
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="8" text-anchor="middle" x="350" y="338">
                    → no drivers found
                </text>
<!-- Right: Worker crash & recovery -->
<rect fill="#eef6ff" filter="url(#p3-03-ride-hailing-fig11-roughenTemporal)" height="130" rx="10" stroke="#0066cc" stroke-width="1.5" width="265" x="490" y="190"></rect>
<text fill="#0066cc" font-family="'Segoe Print', cursive" font-size="11" font-weight="700" text-anchor="middle" x="622" y="212">
                    🔄 Worker restart mid-wait
                </text>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="622" y="235">
                    Temporal replays event history:
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="622" y="255">
                    1. offerDriver(D1) → already done ✓
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="622" y="272">
                    2. waitSignal → resumes timer at 6s
                </text>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="622" y="289">
                    3. No re-execution, no double-offer ✓
                </text>
<text fill="#0066cc" font-family="'Segoe Print', cursive" font-size="8" font-weight="600" text-anchor="middle" x="622" y="308">
                    State survives process crash
                </text>
<!-- Bottom: Comparison banner -->
<rect fill="#ffebee" filter="url(#p3-03-ride-hailing-fig11-roughenTemporal)" height="60" rx="8" stroke="#c62828" stroke-width="1.5" width="355" x="25" y="365"></rect>
<text fill="#c62828" font-family="'Segoe Print', cursive" font-size="10" font-weight="700" text-anchor="middle" x="202" y="388">
                    ❌ In-process setTimeout()
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="202" y="408">
                    Dies on deploy · orphans locks · no audit trail
                </text>
<rect fill="#e8f5e9" filter="url(#p3-03-ride-hailing-fig11-roughenTemporal)" height="60" rx="8" stroke="#0ba360" stroke-width="2" width="355" x="400" y="365"></rect>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="10" font-weight="700" text-anchor="middle" x="577" y="388">
                    ✓ Temporal / Step Functions
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="577" y="408">
                    Durable timers · replayable · Uber Cadence lineage
                </text>
</svg>