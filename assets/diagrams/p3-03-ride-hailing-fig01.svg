<svg style="max-width: 780px" viewbox="0 0 780 420" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p3-03-ride-hailing-fig01-dotGridSM" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p3-03-ride-hailing-fig01-roughenSM" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="2" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<filter height="102%" id="p3-03-ride-hailing-fig01-roughenLightSM" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="5" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<marker id="p3-03-ride-hailing-fig01-exArrowSM" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="p3-03-ride-hailing-fig01-exArrowGreenSM" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#0ba360" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="p3-03-ride-hailing-fig01-exArrowRedSM" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#c62828" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<rect fill="#fefefe" height="420" rx="12" width="780"></rect>
<rect fill="url(#p3-03-ride-hailing-fig01-dotGridSM)" height="420" rx="12" width="780"></rect>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="13" font-weight="600" text-anchor="middle" x="390" y="32">
                    RIDE LIFECYCLE STATE MACHINE
                </text>
<!-- Main happy path -->
<rect fill="#eef6ff" filter="url(#p3-03-ride-hailing-fig01-roughenSM)" height="38" rx="8" stroke="#333" stroke-width="1.5" width="95" x="30" y="70"></rect>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="10" text-anchor="middle" x="77" y="93">
                    requested
                </text>
<path d="M 125 89 L 155 89" filter="url(#p3-03-ride-hailing-fig01-roughenLightSM)" marker-end="url(#p3-03-ride-hailing-fig01-exArrowGreenSM)" stroke="#0ba360" stroke-width="2"></path>
<rect fill="#e8f5e9" filter="url(#p3-03-ride-hailing-fig01-roughenSM)" height="38" rx="8" stroke="#0ba360" stroke-width="1.5" width="95" x="160" y="70"></rect>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="10" text-anchor="middle" x="207" y="93">
                    matching
                </text>
<path d="M 255 89 L 285 89" filter="url(#p3-03-ride-hailing-fig01-roughenLightSM)" marker-end="url(#p3-03-ride-hailing-fig01-exArrowGreenSM)" stroke="#0ba360" stroke-width="2"></path>
<rect fill="#fff8e1" filter="url(#p3-03-ride-hailing-fig01-roughenSM)" height="38" rx="8" stroke="#3cba92" stroke-width="1.5" width="85" x="290" y="70"></rect>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="10" text-anchor="middle" x="332" y="93">
                    offered
                </text>
<path d="M 375 89 L 405 89" filter="url(#p3-03-ride-hailing-fig01-roughenLightSM)" marker-end="url(#p3-03-ride-hailing-fig01-exArrowGreenSM)" stroke="#0ba360" stroke-width="2"></path>
<rect fill="#e8f5e9" filter="url(#p3-03-ride-hailing-fig01-roughenSM)" height="38" rx="8" stroke="#0ba360" stroke-width="2" width="95" x="410" y="70"></rect>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="10" text-anchor="middle" x="457" y="93">
                    accepted
                </text>
<path d="M 505 89 L 535 89" filter="url(#p3-03-ride-hailing-fig01-roughenLightSM)" marker-end="url(#p3-03-ride-hailing-fig01-exArrowGreenSM)" stroke="#0ba360" stroke-width="2"></path>
<rect fill="#f0faf5" filter="url(#p3-03-ride-hailing-fig01-roughenSM)" height="38" rx="8" stroke="#3cba92" stroke-width="1.5" width="100" x="540" y="70"></rect>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="10" text-anchor="middle" x="590" y="93">
                    in_progress
                </text>
<path d="M 640 89 L 670 89" filter="url(#p3-03-ride-hailing-fig01-roughenLightSM)" marker-end="url(#p3-03-ride-hailing-fig01-exArrowGreenSM)" stroke="#0ba360" stroke-width="2"></path>
<rect fill="#e8f5e9" filter="url(#p3-03-ride-hailing-fig01-roughenSM)" height="38" rx="8" stroke="#0ba360" stroke-width="2" width="75" x="675" y="70"></rect>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="10" text-anchor="middle" x="712" y="93">
                    completed
                </text>
<!-- Timeout loop -->
<path d="M 332 108 C 332 155, 207 155, 207 110" fill="none" filter="url(#p3-03-ride-hailing-fig01-roughenLightSM)" marker-end="url(#p3-03-ride-hailing-fig01-exArrowGreenSM)" stroke="#3cba92" stroke-dasharray="5,3" stroke-width="1.5"></path>
<text fill="#3cba92" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="270" y="148">
                    driver timeout (10s)
                </text>
<!-- No driver branch -->
<path d="M 207 108 C 207 200, 120 200, 120 250" fill="none" filter="url(#p3-03-ride-hailing-fig01-roughenLightSM)" marker-end="url(#p3-03-ride-hailing-fig01-exArrowRedSM)" stroke="#c62828" stroke-dasharray="4,3" stroke-width="1.5"></path>
<rect fill="#ffebee" filter="url(#p3-03-ride-hailing-fig01-roughenSM)" height="38" rx="8" stroke="#c62828" stroke-width="1.5" width="130" x="55" y="250"></rect>
<text fill="#c62828" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="120" y="273">
                    no_driver_found
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" x="175" y="195">
                    exhausted candidates
                </text>
<!-- Rider cancel -->
<rect fill="#fff3e0" filter="url(#p3-03-ride-hailing-fig01-roughenSM)" height="38" rx="8" stroke="#e65100" stroke-dasharray="4,2" stroke-width="1.5" width="180" x="300" y="250"></rect>
<text fill="#e65100" font-family="'Segoe Print', cursive" font-size="10" text-anchor="middle" x="390" y="273">
                    cancelled (pre-trip)
                </text>
<path d="M 390 108 C 390 210, 390 248, 390 250" fill="none" filter="url(#p3-03-ride-hailing-fig01-roughenLightSM)" marker-end="url(#p3-03-ride-hailing-fig01-exArrowRedSM)" stroke="#e65100" stroke-dasharray="4,3" stroke-width="1.5"></path>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" x="420" y="195">
                    from requested · matching · offered
                </text>
<!-- Legend -->
<rect fill="#f5f5f7" filter="url(#p3-03-ride-hailing-fig01-roughenLightSM)" height="65" rx="10" stroke="#ccc" stroke-width="1" width="670" x="55" y="330"></rect>
<line marker-end="url(#p3-03-ride-hailing-fig01-exArrowGreenSM)" stroke="#0ba360" stroke-width="2" x1="80" x2="110" y1="355" y2="355"></line>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="10" x="120" y="359">
                    Happy path
                </text>
<line marker-end="url(#p3-03-ride-hailing-fig01-exArrowGreenSM)" stroke="#3cba92" stroke-dasharray="5,3" stroke-width="1.5" x1="230" x2="260" y1="355" y2="355"></line>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="10" x="270" y="359">
                    Retry matching
                </text>
<line marker-end="url(#p3-03-ride-hailing-fig01-exArrowRedSM)" stroke="#c62828" stroke-dasharray="4,3" stroke-width="1.5" x1="400" x2="430" y1="355" y2="355"></line>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="10" x="440" y="359">
                    Terminal failure
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="390" y="382">
                    PostgreSQL Ride row is source of truth for every transition
                </text>
</svg>