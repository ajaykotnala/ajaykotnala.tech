<svg style="max-width: 760px" viewbox="0 0 760 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p3-03-ride-hailing-fig07-dotGridPing" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p3-03-ride-hailing-fig07-roughenPing" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="2" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<filter height="102%" id="p3-03-ride-hailing-fig07-roughenLightPing" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="5" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<marker id="p3-03-ride-hailing-fig07-exArrowPing" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#0ba360" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<rect fill="#fefefe" height="400" rx="12" width="760"></rect>
<rect fill="url(#p3-03-ride-hailing-fig07-dotGridPing)" height="400" rx="12" width="760"></rect>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="13" font-weight="600" text-anchor="middle" x="380" y="30">
                    ADAPTIVE PING INTERVAL STATE MACHINE
                </text>
<!-- States in diamond layout -->
<rect fill="#f5f5f7" filter="url(#p3-03-ride-hailing-fig07-roughenPing)" height="70" rx="12" stroke="#86868b" stroke-width="2" width="150" x="40" y="80"></rect>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="12" font-weight="600" text-anchor="middle" x="115" y="108">
                    Idle
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="11" text-anchor="middle" x="115" y="128">
                    30s interval
                </text>
<rect fill="#eef6ff" filter="url(#p3-03-ride-hailing-fig07-roughenPing)" height="70" rx="12" stroke="#0066cc" stroke-width="2" width="160" x="280" y="80"></rect>
<text fill="#0066cc" font-family="'Segoe Print', cursive" font-size="12" font-weight="600" text-anchor="middle" x="360" y="108">
                    Cruising
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="11" text-anchor="middle" x="360" y="128">
                    15s interval
                </text>
<rect fill="#fff8e1" filter="url(#p3-03-ride-hailing-fig07-roughenPing)" height="70" rx="12" stroke="#3cba92" stroke-width="2" width="190" x="530" y="80"></rect>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="12" font-weight="600" text-anchor="middle" x="625" y="108">
                    Near Pickup
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="11" text-anchor="middle" x="625" y="128">
                    5s interval
                </text>
<rect fill="#e8f5e9" filter="url(#p3-03-ride-hailing-fig07-roughenPing)" height="70" rx="12" stroke="#0ba360" stroke-width="2" width="160" x="280" y="240"></rect>
<text fill="#0ba360" font-family="'Segoe Print', cursive" font-size="12" font-weight="600" text-anchor="middle" x="360" y="268">
                    On Trip
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="11" text-anchor="middle" x="360" y="288">
                    3s interval
                </text>
<!-- Transitions -->
<path d="M 190 115 C 230 115, 250 115, 280 115" fill="none" filter="url(#p3-03-ride-hailing-fig07-roughenLightPing)" marker-end="url(#p3-03-ride-hailing-fig07-exArrowPing)" stroke="#0ba360" stroke-width="2"></path>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="9" x="235" y="108">
                    speed &gt; 5 mph
                </text>
<path d="M 440 115 C 480 115, 500 115, 530 115" fill="none" filter="url(#p3-03-ride-hailing-fig07-roughenLightPing)" marker-end="url(#p3-03-ride-hailing-fig07-exArrowPing)" stroke="#0ba360" stroke-width="2"></path>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="9" x="485" y="108">
                    ride matched
                </text>
<path d="M 625 150 C 625 190, 625 210, 440 275" fill="none" filter="url(#p3-03-ride-hailing-fig07-roughenLightPing)" marker-end="url(#p3-03-ride-hailing-fig07-exArrowPing)" stroke="#0ba360" stroke-width="2"></path>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="9" x="540" y="210">
                    rider picked up
                </text>
<path d="M 360 240 C 360 200, 360 170, 360 150" fill="none" filter="url(#p3-03-ride-hailing-fig07-roughenLightPing)" marker-end="url(#p3-03-ride-hailing-fig07-exArrowPing)" stroke="#86868b" stroke-dasharray="4,3" stroke-width="1.5"></path>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" x="380" y="195">
                    trip ends
                </text>
<path d="M 115 150 C 115 200, 115 275, 280 275" fill="none" filter="url(#p3-03-ride-hailing-fig07-roughenLightPing)" marker-end="url(#p3-03-ride-hailing-fig07-exArrowPing)" stroke="#86868b" stroke-dasharray="4,3" stroke-width="1.5"></path>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" x="175" y="220">
                    parked
                </text>
<!-- Sensor triggers box -->
<rect fill="#f0faf5" filter="url(#p3-03-ride-hailing-fig07-roughenLightPing)" height="50" rx="10" stroke="#3cba92" width="680" x="40" y="330"></rect>
<text fill="#333" font-family="'Segoe Print', cursive" font-size="10" text-anchor="middle" x="380" y="352">
                    Triggers: GPS speed · distance-to-pickup · ride status webhook · motion sensors
                </text>
<text fill="#86868b" font-family="'Segoe Print', cursive" font-size="9" text-anchor="middle" x="380" y="370">
                    Client-side backoff cuts ~2M writes/sec at fleet scale without lying during active matching
                </text>
</svg>