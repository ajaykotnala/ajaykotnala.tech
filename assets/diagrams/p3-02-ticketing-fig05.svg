<svg style="max-width: 780px" viewbox="0 0 780 380" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="20" id="p3-02-ticketing-fig05-dotGrid" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern><marker id="p3-02-ticketing-fig05-exArrowRed" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#C4242D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker><marker id="p3-02-ticketing-fig05-exArrow" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker><filter height="102%" id="p3-02-ticketing-fig05-roughenLight" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="5" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter><filter height="104%" id="p3-02-ticketing-fig05-roughen" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="2" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter></defs>
<rect fill="#fefefe" height="380" rx="12" width="780"></rect>
