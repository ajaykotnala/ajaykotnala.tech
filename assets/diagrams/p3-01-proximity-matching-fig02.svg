<svg style="max-width:760px;" viewbox="0 0 760 340" xmlns="http://www.w3.org/2000/svg"><defs><marker id="p3-01-proximity-matching-fig02-exArrow" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker><filter height="102%" id="p3-01-proximity-matching-fig02-roughenLight" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="5" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter><filter height="104%" id="p3-01-proximity-matching-fig02-roughen" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="2" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter><pattern height="20" id="p3-01-proximity-matching-fig02-dotGrid" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern></defs>
<rect fill="#fefefe" height="340" rx="12" width="760"></rect>
<rect fill="url(#p3-01-proximity-matching-fig02-dotGrid)" height="340" rx="12" width="760"></rect>
<!-- Timeline Labels -->
<text fill="#e8445a" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="13" font-weight="700" x="30" y="70">Person A</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="13" font-weight="700" x="30" y="190">Server</text>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="13" font-weight="700" x="30" y="290">Person B</text>
<!-- Swimlane line -->
<line stroke="#e0e0e0" stroke-width="1" x1="120" x2="120" y1="45" y2="320"></line>
<!-- Time arrow -->
<path d="M 140 30 L 718 30" fill="none" filter="url(#p3-01-proximity-matching-fig02-roughenLight)" marker-end="url(#p3-01-proximity-matching-fig02-exArrow)" stroke="#ccc" stroke-width="1.5"></path>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" text-anchor="middle" x="430" y="22">TIME →</text>
<!-- Step 1: A swipes -->
<circle cx="180" cy="70" fill="#e8445a" filter="url(#p3-01-proximity-matching-fig02-roughenLight)" r="7"></circle>
<text fill="#e8445a" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="180" y="55">Swipe →</text>
<path d="M 180 78 C 195 120, 210 155, 232 175" fill="none" filter="url(#p3-01-proximity-matching-fig02-roughenLight)" stroke="#e8445a" stroke-dasharray="5,3" stroke-width="1.5"></path>
<!-- Step 2: B swipes -->
<circle cx="220" cy="290" fill="#0066cc" filter="url(#p3-01-proximity-matching-fig02-roughenLight)" r="7"></circle>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="220" y="310">Swipe →</text>
<path d="M 220 282 C 235 250, 250 215, 272 195" fill="none" filter="url(#p3-01-proximity-matching-fig02-roughenLight)" stroke="#0066cc" stroke-dasharray="5,3" stroke-width="1.5"></path>
<!-- Step 3: Check for A (no inverse found) -->
<rect fill="#fce4ec" filter="url(#p3-01-proximity-matching-fig02-roughen)" height="24" rx="6" stroke="#e8445a" stroke-width="1.5" width="135" x="228" y="168"></rect>
<text fill="#e8445a" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="295" y="184">Check B→A: ✗ None</text>
<!-- Step 4: Check for B (no inverse found) -->
<rect fill="#eef6ff" filter="url(#p3-01-proximity-matching-fig02-roughen)" height="24" rx="6" stroke="#0066cc" stroke-width="1.5" width="135" x="268" y="195"></rect>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="335" y="211">Check A→B: ✗ None</text>
<!-- Step 5: Save A's swipe -->
<rect fill="#f5f5f7" filter="url(#p3-01-proximity-matching-fig02-roughen)" height="24" rx="6" stroke="#ccc" stroke-width="1" width="120" x="425" y="168"></rect>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="485" y="184">Save A→B ✓</text>
<!-- Step 6: Save B's swipe -->
<rect fill="#f5f5f7" filter="url(#p3-01-proximity-matching-fig02-roughen)" height="24" rx="6" stroke="#ccc" stroke-width="1" width="120" x="465" y="195"></rect>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="525" y="211">Save B→A ✓</text>
<!-- Result: No match -->
<rect fill="#fce4ec" filter="url(#p3-01-proximity-matching-fig02-roughen)" height="38" rx="10" stroke="#e8445a" stroke-width="2" width="130" x="610" y="172"></rect>
<text fill="#e8445a" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="13" font-weight="700" text-anchor="middle" x="675" y="192">💔 No Match!</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="675" y="205">Both saved, match lost</text>
</svg>