<path d="M 50 100 L 730 100" fill="none" stroke="#ccc" stroke-dasharray="4,4" stroke-width="1.5"></path>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="130" y="90">
                    t = 0s
                </text>
<text fill="#e11d48" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" font-weight="700" text-anchor="middle" x="620" y="90">
                    t = 60s — TTL expires
                </text>
<rect fill="#dcfce7" filter="url(#p2-02-caching-fig03-roughenK3)" height="24" rx="5" stroke="#16a34a" stroke-width="1.2" width="500" x="60" y="115"></rect>
<text fill="#15803d" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="310" y="132">
