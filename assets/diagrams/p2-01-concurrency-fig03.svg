<svg style="max-width: 780px" viewbox="0 0 780 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p2-01-concurrency-fig03-dotGridC3" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p2-01-concurrency-fig03-roughenC3" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="4" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<marker id="p2-01-concurrency-fig03-exArrowC3" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#9333ea" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<filter height="102%" id="p2-01-concurrency-fig03-roughenLightC1" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="5" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter></defs>
<rect fill="#fefefe" height="300" rx="12" width="780"></rect>
<rect fill="url(#p2-01-concurrency-fig03-dotGridC3)" height="300" rx="12" width="780"></rect>
<!-- Producer -->
<rect fill="#eef2ff" filter="url(#p2-01-concurrency-fig03-roughenC3)" height="60" rx="9" stroke="#4f46e5" stroke-width="1.5" width="130" x="40" y="110"></rect>
<text fill="#4f46e5" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="105" y="135">
                    Producer
                </text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="105" y="152">
                    User login event
                </text>
<!-- Queue -->
<rect fill="#f5f3ff" filter="url(#p2-01-concurrency-fig03-roughenC3)" height="140" rx="9" stroke="#9333ea" stroke-width="1.5" width="260" x="260" y="70"></rect>
<text fill="#9333ea" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="390" y="95">
                    BlockingQueue (capacity 100)
                </text>
<rect fill="#c4b5fd" filter="url(#p2-01-concurrency-fig03-roughenC3)" height="26" rx="4" width="26" x="280" y="110"></rect>
<rect fill="#c4b5fd" filter="url(#p2-01-concurrency-fig03-roughenC3)" height="26" rx="4" width="26" x="312" y="110"></rect>
<rect fill="#c4b5fd" filter="url(#p2-01-concurrency-fig03-roughenC3)" height="26" rx="4" width="26" x="344" y="110"></rect>
<rect fill="#c4b5fd" filter="url(#p2-01-concurrency-fig03-roughenC3)" height="26" rx="4" width="26" x="376" y="110"></rect>
<rect fill="#e9e3fc" filter="url(#p2-01-concurrency-fig03-roughenC3)" height="26" rx="4" stroke="#9333ea" stroke-dasharray="2,2" width="26" x="408" y="110"></rect>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="390" y="160">
                    Full queue = producer blocks on put()
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="390" y="178">
                    = automatic backpressure
                </text>
<!-- Consumer -->
<rect fill="#eef2ff" filter="url(#p2-01-concurrency-fig03-roughenC3)" height="60" rx="9" stroke="#4f46e5" stroke-width="1.5" width="130" x="610" y="110"></rect>
<text fill="#4f46e5" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="675" y="135">
                    Consumer
                </text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="675" y="152">
                    Email worker
                </text>
<path d="M 172 140 L 256 140" fill="none" filter="url(#p2-01-concurrency-fig03-roughenLightC1)" marker-end="url(#p2-01-concurrency-fig03-exArrowC3)" stroke="#4f46e5" stroke-width="2"></path>
<text fill="#4f46e5" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="214" y="130">
                    put()
                </text>
<path d="M 524 140 L 606 140" fill="none" filter="url(#p2-01-concurrency-fig03-roughenLightC1)" marker-end="url(#p2-01-concurrency-fig03-exArrowC3)" stroke="#4f46e5" stroke-width="2"></path>
<text fill="#4f46e5" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="565" y="130">
                    take()
                </text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="390" y="250">
                    Consumer sleeps when empty, wakes on put() — zero busy-waiting either direction.
                </text>
</svg>