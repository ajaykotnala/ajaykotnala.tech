<!-- Client -->
<rect fill="#1a1e28" height="52" rx="1" stroke="#272d3d" stroke-width="1.5" width="100" x="18" y="60"></rect>
<text fill="#9aa3bc" font-size="10" font-style="italic" text-anchor="middle" x="68" y="79">Client</text>
<text fill="#6272a4" font-size="8" text-anchor="middle" x="68" y="97">query(sql)</text>
<!-- arrow client → interface -->
<line marker-end="url(#p1-02-structural-fig03-px1)" stroke="#4f8ef7" stroke-width="1.5" x1="118" x2="158" y1="86" y2="86"></line>
<!-- IDatabase interface -->
<rect fill="#1a1e28" height="84" rx="1" stroke="#272d3d" stroke-width="1.5" width="130" x="158" y="44"></rect>
<rect fill="#0a0c10" height="20" rx="1" width="130" x="158" y="44"></rect>
<rect fill="#0a0c10" height="10" width="130" x="158" y="54"></rect>
