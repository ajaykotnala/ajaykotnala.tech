<svg style="max-width: 780px" viewbox="0 0 780 290" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p2-03-rate-limiting-fig03-dotGridR3" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p2-03-rate-limiting-fig03-roughenR3" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="23" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
</defs>
<rect fill="#fefefe" height="290" rx="12" width="780"></rect>
<rect fill="url(#p2-03-rate-limiting-fig03-dotGridR3)" height="290" rx="12" width="780"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" text-anchor="middle" x="390" y="28">
                    Limit: 100 requests per minute. Actual burst: 200 in two seconds.
                </text>
<!-- windows -->
<rect fill="#eef6ff" filter="url(#p2-03-rate-limiting-fig03-roughenR3)" height="80" rx="6" stroke="#0066cc" stroke-width="1.4" width="320" x="60" y="60"></rect>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" font-weight="700" text-anchor="middle" x="220" y="82">Window A — 10:00:00 to 10:00:59</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="220" y="105">counter: 0 … 0 … 0 … then 100 at 10:00:59</text>
<text fill="#15803d" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" font-weight="700" text-anchor="middle" x="220" y="126">all 100 allowed ✓</text>
<rect fill="#eef6ff" filter="url(#p2-03-rate-limiting-fig03-roughenR3)" height="80" rx="6" stroke="#0066cc" stroke-width="1.4" width="320" x="400" y="60"></rect>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" font-weight="700" text-anchor="middle" x="560" y="82">Window B — 10:01:00 to 10:01:59</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="560" y="105">counter resets to 0, then 100 at 10:01:00</text>
<text fill="#15803d" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" font-weight="700" text-anchor="middle" x="560" y="126">all 100 allowed ✓</text>
<!-- boundary marker -->
<path d="M 390 50 L 390 200" fill="none" stroke="#be123c" stroke-dasharray="5,4" stroke-width="2"></path>
<text fill="#be123c" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" font-weight="700" text-anchor="middle" x="390" y="45">reset</text>
<!-- burst zone -->
<rect fill="#fff1f2" filter="url(#p2-03-rate-limiting-fig03-roughenR3)" height="42" rx="6" stroke="#be123c" stroke-width="1.5" width="120" x="330" y="160"></rect>
<text fill="#be123c" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="390" y="178">200 requests</text>
<text fill="#be123c" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="390" y="194">in ~2 seconds</text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="390" y="232">
                    Both windows are individually compliant. The interval straddling them is 2× the limit.
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="390" y="256">
                    Downstream capacity doesn't care where your window boundaries are.
                </text>
</svg>