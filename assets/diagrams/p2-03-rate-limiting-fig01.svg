<svg style="max-width: 780px" viewbox="0 0 780 330" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p2-03-rate-limiting-fig01-dotGridR1" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p2-03-rate-limiting-fig01-roughenR1" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="21" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<marker id="p2-03-rate-limiting-fig01-exArrowR1" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<rect fill="#fefefe" height="330" rx="12" width="780"></rect>
<rect fill="url(#p2-03-rate-limiting-fig01-dotGridR1)" height="330" rx="12" width="780"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" text-anchor="middle" x="390" y="30">
                    The same word, three different machines
                </text>
<!-- timeline -->
<path d="M 60 260 L 720 260" fill="none" marker-end="url(#p2-03-rate-limiting-fig01-exArrowR1)" stroke="#999" stroke-width="1.5"></path>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" x="70" y="282">
                    milliseconds
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="360" y="282">
                    seconds → minutes
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="end" x="690" y="282">
                    days → months
                </text>
<!-- concurrency -->
<rect fill="#eef6ff" filter="url(#p2-03-rate-limiting-fig01-roughenR1)" height="115" rx="9" stroke="#0066cc" stroke-width="1.5" width="190" x="50" y="60"></rect>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="145" y="84">
                    Concurrency Limit
                </text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="145" y="105">
                    "at most N in flight"
                </text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="145" y="124">
                    protects: a scarce resource
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="145" y="143">
                    DB connections, GPU slots,
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="145" y="156">
                    thread pools
                </text>
<path d="M 145 178 L 145 253" fill="none" stroke="#0066cc" stroke-dasharray="3,3" stroke-width="1.5"></path>
<circle cx="145" cy="260" fill="#0066cc" r="5"></circle>
<!-- rate limit -->
<rect fill="#f5f3ff" filter="url(#p2-03-rate-limiting-fig01-roughenR1)" height="115" rx="9" stroke="#6d28d9" stroke-width="1.5" width="200" x="270" y="60"></rect>
<text fill="#6d28d9" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="370" y="84">
                    Rate Limit
                </text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="370" y="105">
                    "at most N per window"
                </text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="370" y="124">
                    protects: capacity + fairness
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="370" y="143">
                    noisy neighbours, scrapers,
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="370" y="156">
                    credential stuffing
                </text>
<path d="M 370 178 L 370 253" fill="none" stroke="#6d28d9" stroke-dasharray="3,3" stroke-width="1.5"></path>
<circle cx="370" cy="260" fill="#6d28d9" r="5"></circle>
<!-- budget -->
<rect fill="#fdf2f8" filter="url(#p2-03-rate-limiting-fig01-roughenR1)" height="115" rx="9" stroke="#db2777" stroke-width="1.5" width="230" x="500" y="60"></rect>
<text fill="#db2777" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="700" text-anchor="middle" x="615" y="84">
                    Budget / Quota
                </text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="615" y="105">
                    "at most $X per period"
                </text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="615" y="124">
                    protects: money
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="615" y="143">
                    ← Uber's failure and the $6,000
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="8" text-anchor="middle" x="615" y="156">
                    overnight script both live here
                </text>
<path d="M 615 178 L 615 253" fill="none" stroke="#db2777" stroke-dasharray="3,3" stroke-width="1.5"></path>
<circle cx="615" cy="260" fill="#db2777" r="5"></circle>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="390" y="312">
                    A control tuned for one horizon is invisible to failures on another.
                </text>
</svg>