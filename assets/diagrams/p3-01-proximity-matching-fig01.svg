<svg style="max-width:780px;" viewbox="0 0 780 520" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Excalidraw dot grid -->
<pattern height="20" id="p3-01-proximity-matching-fig01-dotGrid" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<!-- Hand-drawn roughness filter -->
<filter height="104%" id="p3-01-proximity-matching-fig01-roughen" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="2" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<filter height="102%" id="p3-01-proximity-matching-fig01-roughenLight" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="5" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<!-- Arrow markers -->
<marker id="p3-01-proximity-matching-fig01-exArrow" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="p3-01-proximity-matching-fig01-exArrowPink" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#e8445a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="p3-01-proximity-matching-fig01-exArrowBlue" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#0066cc" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<!-- Background -->
<rect fill="#fefefe" height="520" rx="12" width="780"></rect>
<rect fill="url(#p3-01-proximity-matching-fig01-dotGrid)" height="520" rx="12" width="780"></rect>
<!-- Mobile Client -->
<rect fill="#eef6ff" filter="url(#p3-01-proximity-matching-fig01-roughen)" height="150" rx="16" stroke="#333" stroke-width="2" width="110" x="30" y="185"></rect>
<rect fill="#ffffff" filter="url(#p3-01-proximity-matching-fig01-roughenLight)" height="105" rx="6" stroke="#999" stroke-width="1" width="86" x="42" y="205"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="22" text-anchor="middle" x="85" y="250">📱</text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="13" text-anchor="middle" x="85" y="278">Mobile</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" text-anchor="middle" x="85" y="296">Client</text>
<!-- Arrow: Client → Gateway -->
<path d="M 142 260 C 160 258, 175 262, 198 260" fill="none" filter="url(#p3-01-proximity-matching-fig01-roughenLight)" marker-end="url(#p3-01-proximity-matching-fig01-exArrow)" stroke="#333" stroke-linecap="round" stroke-width="2"></path>
<!-- API Gateway -->
<rect fill="#e3f2fd" filter="url(#p3-01-proximity-matching-fig01-roughen)" height="120" rx="10" stroke="#0066cc" stroke-width="2" width="130" x="205" y="200"></rect>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="270" y="248">API</text>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="270" y="268">Gateway</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="270" y="295">Auth · Routing</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="270" y="310">Rate Limiting</text>
<!-- Arrow: Gateway → Profile Service -->
<path d="M 335 237 C 352 210, 370 155, 405 130" fill="none" filter="url(#p3-01-proximity-matching-fig01-roughenLight)" marker-end="url(#p3-01-proximity-matching-fig01-exArrowBlue)" stroke="#0066cc" stroke-dasharray="6,4" stroke-linecap="round" stroke-width="2"></path>
<!-- Arrow: Gateway → Swipe Service -->
<path d="M 335 290 C 352 320, 370 365, 405 390" fill="none" filter="url(#p3-01-proximity-matching-fig01-roughenLight)" marker-end="url(#p3-01-proximity-matching-fig01-exArrowPink)" stroke="#e8445a" stroke-dasharray="6,4" stroke-linecap="round" stroke-width="2"></path>
<!-- Profile Service -->
<rect fill="#e8f5e9" filter="url(#p3-01-proximity-matching-fig01-roughen)" height="115" rx="10" stroke="#2e7d32" stroke-width="2" width="145" x="410" y="65"></rect>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="482" y="108">Profile</text>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="482" y="128">Service</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="482" y="152">CRUD · Preferences</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="482" y="167">Feed Generation</text>
<!-- Swipe Service -->
<rect fill="#fce4ec" filter="url(#p3-01-proximity-matching-fig01-roughen)" height="115" rx="10" stroke="#e8445a" stroke-width="2" width="145" x="410" y="340"></rect>
<text fill="#e8445a" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="482" y="383">Swipe</text>
<text fill="#e8445a" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="482" y="403">Service</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="482" y="427">Persist · Match Check</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="482" y="442">Notify</text>
<!-- Arrow: Profile Service → User DB -->
<path d="M 555 122 C 575 120, 600 118, 620 120" fill="none" filter="url(#p3-01-proximity-matching-fig01-roughenLight)" marker-end="url(#p3-01-proximity-matching-fig01-exArrow)" stroke="#2e7d32" stroke-linecap="round" stroke-width="2"></path>
<!-- Arrow: Swipe Service → Swipe DB -->
<path d="M 555 397 C 575 395, 600 393, 620 395" fill="none" filter="url(#p3-01-proximity-matching-fig01-roughenLight)" marker-end="url(#p3-01-proximity-matching-fig01-exArrowPink)" stroke="#e8445a" stroke-linecap="round" stroke-width="2"></path>
<!-- User DB (cylinder drawn by hand) -->
<ellipse cx="690" cy="95" fill="#e8f5e9" filter="url(#p3-01-proximity-matching-fig01-roughen)" rx="55" ry="18" stroke="#333" stroke-width="1.8"></ellipse>
<path d="M 635 95 L 635 140" filter="url(#p3-01-proximity-matching-fig01-roughenLight)" stroke="#333" stroke-width="1.8"></path>
<path d="M 745 95 L 745 140" filter="url(#p3-01-proximity-matching-fig01-roughenLight)" stroke="#333" stroke-width="1.8"></path>
<ellipse cx="690" cy="140" fill="#e8f5e9" filter="url(#p3-01-proximity-matching-fig01-roughen)" rx="55" ry="18" stroke="#333" stroke-width="1.8"></ellipse>
<rect fill="#e8f5e9" height="45" stroke="none" width="110" x="635" y="95"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" font-weight="600" text-anchor="middle" x="690" y="125">User DB</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="690" y="143">PostgreSQL</text>
<!-- Swipe DB (cylinder drawn by hand) -->
<ellipse cx="690" cy="370" fill="#fce4ec" filter="url(#p3-01-proximity-matching-fig01-roughen)" rx="55" ry="18" stroke="#333" stroke-width="1.8"></ellipse>
<path d="M 635 370 L 635 415" filter="url(#p3-01-proximity-matching-fig01-roughenLight)" stroke="#333" stroke-width="1.8"></path>
<path d="M 745 370 L 745 415" filter="url(#p3-01-proximity-matching-fig01-roughenLight)" stroke="#333" stroke-width="1.8"></path>
<ellipse cx="690" cy="415" fill="#fce4ec" filter="url(#p3-01-proximity-matching-fig01-roughen)" rx="55" ry="18" stroke="#333" stroke-width="1.8"></ellipse>
<rect fill="#fce4ec" height="45" stroke="none" width="110" x="635" y="370"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" font-weight="600" text-anchor="middle" x="690" y="400">Swipe DB</text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="690" y="418">Cassandra</text>
<!-- Push Notification -->
<rect fill="#fff3e0" filter="url(#p3-01-proximity-matching-fig01-roughen)" height="34" rx="8" stroke="#e56b47" stroke-dasharray="5,3" stroke-width="1.5" width="145" x="410" y="472"></rect>
<text fill="#e56b47" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" text-anchor="middle" x="482" y="494">APNS / FCM</text>
<!-- Arrow: Swipe → APNS -->
<path d="M 482 455 C 482 462, 480 468, 482 470" fill="none" filter="url(#p3-01-proximity-matching-fig01-roughenLight)" marker-end="url(#p3-01-proximity-matching-fig01-exArrowPink)" stroke="#e56b47" stroke-dasharray="4,3" stroke-linecap="round" stroke-width="1.5"></path>
</svg>