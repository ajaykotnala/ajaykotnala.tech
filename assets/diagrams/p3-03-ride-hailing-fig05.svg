<svg style="max-width: 780px" viewbox="0 0 780 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p3-03-ride-hailing-fig05-dotGridGeo" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
