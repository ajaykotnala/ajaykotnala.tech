<svg style="max-width: 780px" viewbox="0 0 780 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p3-02-ticketing-fig01-dotGrid" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p3-02-ticketing-fig01-roughen" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="2" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<filter height="102%" id="p3-02-ticketing-fig01-roughenLight" width="102%" x="-1%" y="-1%">
<feturbulence basefrequency="0.04" numoctaves="2" result="noise" seed="5" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<marker id="p3-02-ticketing-fig01-exArrow" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#333" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="p3-02-ticketing-fig01-exArrowRed" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#C4242D" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
<marker id="p3-02-ticketing-fig01-exArrowBlue" markerheight="10" markerwidth="10" orient="auto" refx="10" refy="6" viewbox="0 0 12 12">
<path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#0066cc" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</marker>
</defs>
<rect fill="#fefefe" height="320" rx="12" width="780"></rect>
<rect fill="url(#p3-02-ticketing-fig01-dotGrid)" height="320" rx="12" width="780"></rect>
<!-- Client -->
<rect fill="#eef6ff" filter="url(#p3-02-ticketing-fig01-roughen)" height="120" rx="16" stroke="#333" stroke-width="2" width="110" x="30" y="100"></rect>
<rect fill="#ffffff" filter="url(#p3-02-ticketing-fig01-roughenLight)" height="78" rx="6" stroke="#999" stroke-width="1" width="86" x="42" y="118"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="20" text-anchor="middle" x="85" y="155">
                    🌐
                </text>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" text-anchor="middle" x="85" y="178">
                    Client
                </text>
<!-- Arrow: Client → Gateway -->
<path d="M 142 160 C 160 158, 180 162, 198 160" fill="none" filter="url(#p3-02-ticketing-fig01-roughenLight)" marker-end="url(#p3-02-ticketing-fig01-exArrow)" stroke="#333" stroke-linecap="round" stroke-width="2"></path>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="9" text-anchor="middle" x="170" y="148">
                    GET /events/:id
                </text>
<!-- API Gateway -->
<rect fill="#e3f2fd" filter="url(#p3-02-ticketing-fig01-roughen)" height="120" rx="10" stroke="#0066cc" stroke-width="2" width="130" x="205" y="100"></rect>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="270" y="148">
                    API
                </text>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="270" y="168">
                    Gateway
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="270" y="195">
                    Auth · Rate Limit
                </text>
<!-- Arrow: Gateway → Event Service -->
<path d="M 335 160 C 355 158, 380 162, 408 160" fill="none" filter="url(#p3-02-ticketing-fig01-roughenLight)" marker-end="url(#p3-02-ticketing-fig01-exArrowBlue)" stroke="#0066cc" stroke-dasharray="6,4" stroke-linecap="round" stroke-width="2"></path>
<!-- Event Service -->
<rect fill="#e8f5e9" filter="url(#p3-02-ticketing-fig01-roughen)" height="130" rx="10" stroke="#2e7d32" stroke-width="2" width="150" x="415" y="95"></rect>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="490" y="143">
                    Event
                </text>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" font-weight="600" text-anchor="middle" x="490" y="163">
                    Service
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="490" y="190">
                    Events · Venues
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="490" y="205">
                    Performers · Tickets
                </text>
<!-- Arrow: Event Service → DB -->
<path d="M 565 160 C 585 158, 605 162, 625 160" fill="none" filter="url(#p3-02-ticketing-fig01-roughenLight)" marker-end="url(#p3-02-ticketing-fig01-exArrow)" stroke="#2e7d32" stroke-linecap="round" stroke-width="2"></path>
<!-- Events DB (cylinder) -->
<ellipse cx="700" cy="125" fill="#e8f5e9" filter="url(#p3-02-ticketing-fig01-roughen)" rx="55" ry="18" stroke="#333" stroke-width="1.8"></ellipse>
<path d="M 645 125 L 645 175" filter="url(#p3-02-ticketing-fig01-roughenLight)" stroke="#333" stroke-width="1.8"></path>
<path d="M 755 125 L 755 175" filter="url(#p3-02-ticketing-fig01-roughenLight)" stroke="#333" stroke-width="1.8"></path>
<ellipse cx="700" cy="175" fill="#e8f5e9" filter="url(#p3-02-ticketing-fig01-roughen)" rx="55" ry="18" stroke="#333" stroke-width="1.8"></ellipse>
<rect fill="#e8f5e9" height="50" stroke="none" width="110" x="645" y="125"></rect>
<text fill="#333" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" font-weight="600" text-anchor="middle" x="700" y="158">
                    Events DB
                </text>
<text fill="#86868b" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="10" text-anchor="middle" x="700" y="178">
                    PostgreSQL
                </text>
<!-- Labels -->
<text fill="#C4242D" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="600" text-anchor="middle" x="85" y="80">
                    ① Request
                </text>
<text fill="#0066cc" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="600" text-anchor="middle" x="270" y="80">
                    ② Route
                </text>
<text fill="#2e7d32" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" font-weight="600" text-anchor="middle" x="490" y="75">
                    ③ Query &amp; Return
                </text>
</svg>