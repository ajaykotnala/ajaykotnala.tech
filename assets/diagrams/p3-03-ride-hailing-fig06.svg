<svg style="max-width: 780px" viewbox="0 0 780 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="20" id="p3-03-ride-hailing-fig06-dotGrid" patternunits="userSpaceOnUse" width="20">
<circle cx="10" cy="10" fill="#d0d0d0" r="0.8"></circle>
</pattern>
<filter height="104%" id="p3-03-ride-hailing-fig06-roughen" width="104%" x="-2%" y="-2%">
<feturbulence basefrequency="0.03" numoctaves="3" result="noise" seed="2" type="turbulence"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="1.5" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
<filter height="102%" id="p3-03-ride-hailing-fig06-roughenLight" width="102%" x="-1%" y="-1%">
