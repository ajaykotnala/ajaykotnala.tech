<rect width="780" height="305" rx="12" fill="#fefefe"/>
<rect width="780" height="305" rx="12" fill="url(#p2-06-data-storage-fig05-dotGrid)"/>
<text x="390" y="26" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="14" fill="#3d3728" text-anchor="middle" font-weight="700">R + W > N — WHY THE SETS MUST OVERLAP</text>
<text x="210" y="44" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="13" fill="#3d3728" text-anchor="middle" font-weight="700">N=3  W=2  R=2</text>
<rect x="91" y="72" width="54" height="54" rx="27" fill="#eef6ff" stroke="#0066cc" stroke-width="1.6" filter="url(#p2-06-data-storage-fig05-roughen)"/>
<text x="118" y="104" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#3d3728" text-anchor="middle" font-weight="700">R1</text>
<text x="108" y="144" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#0066cc" text-anchor="middle" font-weight="700">W</text>
<rect x="183" y="72" width="54" height="54" rx="27" fill="#fff8e1" stroke="#d97706" stroke-width="1.6" filter="url(#p2-06-data-storage-fig05-roughen)"/>
<text x="210" y="104" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#3d3728" text-anchor="middle" font-weight="700">R2</text>
<text x="200" y="144" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#0066cc" text-anchor="middle" font-weight="700">W</text>
<text x="220" y="144" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#0ba360" text-anchor="middle" font-weight="700">R</text>
<rect x="275" y="72" width="54" height="54" rx="27" fill="#e8f5e9" stroke="#0ba360" stroke-width="1.6" filter="url(#p2-06-data-storage-fig05-roughen)"/>
<text x="302" y="104" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#3d3728" text-anchor="middle" font-weight="700">R3</text>
<text x="292" y="144" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#0ba360" text-anchor="middle" font-weight="700">R</text>
<rect x="72" y="158" width="276" height="34" rx="8" fill="#e8f5e9" stroke="#0ba360" stroke-width="1.4" filter="url(#p2-06-data-storage-fig05-roughen)"/>
<text x="210" y="180" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="700">2 + 2 > 3  →  R2 overlaps. Guaranteed.</text>
<text x="570" y="44" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="13" fill="#3d3728" text-anchor="middle" font-weight="700">N=3  W=1  R=1</text>
<rect x="451" y="72" width="54" height="54" rx="27" fill="#eef6ff" stroke="#0066cc" stroke-width="1.6" filter="url(#p2-06-data-storage-fig05-roughen)"/>
<text x="478" y="104" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#3d3728" text-anchor="middle" font-weight="700">R1</text>
<text x="468" y="144" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#0066cc" text-anchor="middle" font-weight="700">W</text>
<rect x="543" y="72" width="54" height="54" rx="27" fill="#f5f5f7" stroke="#86868b" stroke-width="1.6" filter="url(#p2-06-data-storage-fig05-roughen)"/>
<text x="570" y="104" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#3d3728" text-anchor="middle" font-weight="700">R2</text>
<rect x="635" y="72" width="54" height="54" rx="27" fill="#e8f5e9" stroke="#0ba360" stroke-width="1.6" filter="url(#p2-06-data-storage-fig05-roughen)"/>
<text x="662" y="104" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#3d3728" text-anchor="middle" font-weight="700">R3</text>
<text x="652" y="144" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="12" fill="#0ba360" text-anchor="middle" font-weight="700">R</text>
<rect x="432" y="158" width="276" height="34" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.4" filter="url(#p2-06-data-storage-fig05-roughen)"/>
<text x="570" y="180" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" fill="#c62828" text-anchor="middle" font-weight="700">1 + 1 < 3  →  no overlap. Stale read is legal.</text>
<text x="390" y="268" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" fill="#86868b" text-anchor="middle" font-weight="400" font-style="italic">The overlap is the entire guarantee — there is no consensus protocol here,</text>
<text x="390" y="285" font-family="'Segoe Print', 'Comic Neue', cursive" font-size="11" fill="#86868b" text-anchor="middle" font-weight="400" font-style="italic">only a pigeonhole argument.</text>
</svg>
