<circle cx="10" cy="10" r="0.8" fill="#d0d0d0"/></pattern>
<filter id="p2-06-data-storage-fig05-roughen" x="-2%" y="-2%" width="104%" height="104%">
<feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="3" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<marker id="p2-06-data-storage-fig05-arw" viewBox="0 0 12 12" refX="10" refY="6"
 markerWidth="10" markerHeight="10" orient="auto">
